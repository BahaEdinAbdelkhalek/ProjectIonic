<ion-header>
  <ion-toolbar>
    <ion-title>CinWatch</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>Bienvenue</ion-card-subtitle>
      <ion-card-title>Connectez-vous</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-input
            label="Email"
            labelPlacement="stacked"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="vous@exemple.com"
            [(ngModel)]="email"
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Mot de passe"
            labelPlacement="stacked"
            type="password"
            autocomplete="current-password"
            placeholder="6 caracteres minimum"
            [(ngModel)]="motDePasse"
          ></ion-input>
        </ion-item>
      </ion-list>

      <ion-text color="danger" *ngIf="messageErreur">
        <p>{{ messageErreur }}</p>
      </ion-text>

      <ion-button expand="block" (click)="seConnecter()">Se connecter</ion-button>

      <ion-button expand="block" fill="clear" (click)="allerAInscription()">
        Creer un compte
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>

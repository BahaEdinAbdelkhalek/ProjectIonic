<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/films" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Detail</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-progress-bar type="indeterminate" *ngIf="chargement"></ion-progress-bar>

  <ion-list *ngIf="!chargement && introuvable">
    <ion-item>
      <ion-label class="ion-text-center">
        <ion-icon name="alert-circle-outline" size="large" color="medium"></ion-icon>
        <h2>Film introuvable</h2>
        <p>Ce film n est plus disponible dans le catalogue.</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-list *ngIf="!chargement && film !== undefined">
    <ion-item>
      <ion-thumbnail slot="start">
        <img [src]="film.image" [alt]="film.titre" />
      </ion-thumbnail>

      <ion-label>
        <h1>{{ film.titre }}</h1>
        <p>{{ film.annee }}</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="star" slot="start" color="warning"></ion-icon>
      <ion-label>Note</ion-label>
      <ion-note slot="end">{{ film.note }} / 10</ion-note>
    </ion-item>

    <ion-item>
      <ion-icon name="calendar-outline" slot="start"></ion-icon>
      <ion-label>Annee</ion-label>
      <ion-note slot="end">{{ film.annee }}</ion-note>
    </ion-item>

    <ion-item>
      <ion-icon name="heart-outline" slot="start"></ion-icon>
      <ion-label>Favori</ion-label>
      <ion-toggle
        slot="end"
        [checked]="favori"
        (ionChange)="basculerFavori()"
        aria-label="Ajouter aux favoris"
      ></ion-toggle>
    </ion-item>
  </ion-list>

  <ion-accordion-group *ngIf="!chargement && film !== undefined">
    <ion-accordion value="resume">
      <ion-item slot="header">
        <ion-icon name="document-text-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Resume</ion-label>
      </ion-item>

      <ion-label class="ion-padding-start ion-padding-end">
        <p class="ion-text-justify">{{ film.resume }}</p>
      </ion-label>
    </ion-accordion>
  </ion-accordion-group>
</ion-content>

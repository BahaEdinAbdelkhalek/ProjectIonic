<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{% block title %}CinWatch{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'movie_list' %}">CinWatch</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link text-white" href="{% url 'movie_list' %}">Films</a>
        <a class="nav-link text-white" href="{% url 'movie_create' %}">Ajouter</a>
        <a class="nav-link text-white" href="/admin/">Admin</a>
        {% if user.is_authenticated %}
          <span class="navbar-text text-white ms-3">{{ user.username }}</span>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
